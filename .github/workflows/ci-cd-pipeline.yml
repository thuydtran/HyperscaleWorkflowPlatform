name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # This automatically uses your repository name (e.g., yourusername/HyperscaleWorkflowPlatform)
  IMAGE_NAME: ${{ github.repository }}/nvidia-worker-core

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Required permissions to push container images to GitHub Packages (GHCR)
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # Step 1: Check out your repository code onto the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python runtime environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Step 3: Install dependencies (safely skips if requirements.txt isn't created yet)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Set up Docker Buildx (enables high-performance multi-layer caching)
      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      # Step 5: Log in to the GitHub Container Registry (GHCR)
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 6: Build and Push the Container Image
      - name: Build and Push Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max